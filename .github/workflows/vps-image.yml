# Build the captain's Hermes image from this branch and push it to GHCR:
# ghcr.io/corygforsythe/hermes-agent:<full commit SHA> and :vps-patches.
# See vps/README.md.
name: vps-image

on:
  push:
    branches: [vps-patches]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: vps-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: Build and push
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      # The upstream image (Playwright, node_modules, venv) plus CPU torch
      # outgrows the runner's free disk.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f  # v7.4.0
        env:
          GIT_SHA: ${{ github.sha }}
        with:
          source: .
          files: vps/docker-bake.hcl
          push: true
          set: |
            upstream.cache-from=type=gha,scope=upstream
            upstream.cache-to=type=gha,mode=max,scope=upstream
            vps.cache-from=type=gha,scope=vps
            vps.cache-to=type=gha,mode=max,scope=vps
